<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a97f2"/>
      <stop offset="1" stop-color="#1c56b0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Hintergrund -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#shine)"/>
  <!-- Ringdiagramm: Budget-Aufteilung (Umfang 2π·132 ≈ 829.4, Lücken 24) -->
  <g transform="rotate(-90 256 256)" fill="none" stroke-width="60">
    <circle cx="256" cy="256" r="132" stroke="#ffffff" stroke-dasharray="415 829.4"/>
    <circle cx="256" cy="256" r="132" stroke="#ffffff" stroke-opacity=".55" stroke-dasharray="226 829.4" stroke-dashoffset="-439"/>
    <circle cx="256" cy="256" r="132" stroke="#7fe8b8" stroke-dasharray="116.4 829.4" stroke-dashoffset="-689"/>
  </g>
  <!-- Mitte: kleines Säulendiagramm -->
  <g fill="#ffffff">
    <rect x="203" y="258" width="30" height="54" rx="8"/>
    <rect x="241" y="226" width="30" height="86" rx="8"/>
    <rect x="279" y="194" width="30" height="118" rx="8"/>
  </g>
</svg>
